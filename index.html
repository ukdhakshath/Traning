
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My CI/CD Testing Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      max-width: 500px;
      margin: 20px;
      box-shadow: 0 5px 20px #00000015;
    }

    h1 {
      color: #1d4ed8;
    }

    p {
      color: #475569;
      line-height: 1.6;
    }

    button {
      background: #1d4ed8;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Hello, GitHub Pages!</h1>

    <p>
      This website is deployed automatically
      using GitHub Actions CI/CD.
    </p>

    <button onclick="showMessage()">
      Test Website
    </button>

    <p id="message"></p>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Website is working successfully!";
    }
  </script>
</body>
</html>
